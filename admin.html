<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | Moyenda Tour Guide</title>
  <link rel="icon" href="assets/images/moyenda-logo.jpg">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { padding-top: 0; background: #F3F6F9; }
    .admin-top { background: var(--navy); color: #fff; padding: 16px 0; }
    .admin-top .container { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .admin-top strong { font-size: 16px; }
    .admin-top small { color: #AFC2D6; }
    .admin-top button { background: transparent; color: #fff; border: 1.5px solid #AFC2D6; border-radius: 999px; padding: 8px 16px; cursor: pointer; font: 600 14px system-ui, sans-serif; }
    .admin-wrap { padding: 28px 0 60px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
    .tabs button { border: 1.5px solid var(--line); background: #fff; color: var(--navy-2); border-radius: 999px; padding: 9px 16px; cursor: pointer; font: 600 14px system-ui, sans-serif; }
    .tabs button.active { background: var(--navy); color: #fff; border-color: var(--navy); }
    .panel-admin { background: #fff; border-radius: 16px; padding: 24px; box-shadow: var(--shadow-sm); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--navy-2); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
    td .muted { color: var(--muted); }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .mini { border: 1.5px solid var(--primary); background: #fff; color: var(--primary-dark); border-radius: 8px; padding: 6px 10px; cursor: pointer; font: 600 13px system-ui, sans-serif; }
    .mini.danger { border-color: var(--accent); color: var(--accent); }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
    .field-grid .full { grid-column: 1 / -1; }
    .admin-form label { display: grid; gap: 6px; font-size: 13px; font-weight: 700; color: var(--navy-2); }
    .admin-form input, .admin-form select, .admin-form textarea { font: 14px system-ui, sans-serif; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; width: 100%; background: #fff; color: var(--ink); }
    .admin-form textarea { min-height: 110px; }
    .admin-msg { margin-top: 12px; font-size: 14px; }
    .admin-msg.err { color: var(--accent); }
    .admin-msg.ok { color: #1C6F9E; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
    .stat { background: #fff; border-radius: 14px; padding: 18px; box-shadow: var(--shadow-sm); }
    .stat strong { display: block; font-size: 28px; color: var(--navy); }
    .stat span { font-size: 13px; color: var(--muted); }
    .login-card { max-width: 420px; margin: 80px auto; background: #fff; padding: 36px; border-radius: 18px; box-shadow: var(--shadow); }
    .login-card h1 { font-size: 26px; margin-bottom: 8px; }
    .hidden { display: none !important; }
    @media (max-width: 700px) { .field-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div id="login-view" class="login-card">
  <span class="eyebrow">Staff only</span>
  <h1>Admin sign-in</h1>
  <p class="form-note" style="margin-bottom:20px">Sign in with a Supabase Auth account that has an approved admin role.</p>
  <form id="login-form" class="admin-form" novalidate>
    <label>Email<input type="email" name="email" required autocomplete="username"></label>
    <label style="margin-top:12px">Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button type="submit" class="btn btn-gold" style="margin-top:18px;width:100%">Sign in</button>
    <div id="login-msg" class="admin-msg err" role="alert"></div>
  </form>
</div>

<div id="app-view" class="hidden">
  <div class="admin-top">
    <div class="container">
      <div><strong>Moyenda Admin</strong><br><small id="who"></small></div>
      <button id="logout" type="button">Sign out</button>
    </div>
  </div>
  <div class="container admin-wrap">
    <nav class="tabs" id="tabs" aria-label="Admin sections"></nav>
    <div id="content" class="panel-admin" aria-live="polite"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="assets/js/app.js" defer></script>
<script src="assets/js/admin.js" defer></script>
</body>
</html>
