[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Sync Instagram posts from the official Graph API every 30 minutes
[functions."instagram-sync"]
  schedule = "*/30 * * * *"

# Friendly API paths for the browser: /api/ai-guide -> function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Unknown URLs get the branded 404 page (Netlify serves /404.html automatically)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https://*.supabase.co https://*.supabase.in https://*.cdninstagram.com https://*.fbcdn.net https://scontent.cdninstagram.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co https://*.supabase.in; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://wa.me"

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Keep the admin area out of search engines, at the server level as well as in the page
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
